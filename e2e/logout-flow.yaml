appId: com.thenm334.carebridgemobile
env:
  E2E_PARENT_EMAIL: ${E2E_PARENT_EMAIL}
  E2E_PARENT_PASSWORD: ${E2E_PARENT_PASSWORD}
---
- runFlow: auth-login.yaml
# Navigate to Profile tab
- tapOn:
    text: "Profile"
# Tap "Log out"
- tapOn:
    text: "Log out"
# Assert the app returns to the welcome screen
- assertTrue:
    visible:
      anyOf:
        - text: "Sign up"
        - text: "Log in"
