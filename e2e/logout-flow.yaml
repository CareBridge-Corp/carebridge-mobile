appId: com.thenm334.carebridgemobile
env:
  E2E_PARENT_EMAIL: ${E2E_PARENT_EMAIL}
  E2E_PARENT_PASSWORD: ${E2E_PARENT_PASSWORD}
---
- runFlow: auth-login.yaml
# Open profile / settings — typically a profile icon or menu in the header
- tapOn:
    id: "profile-button"
    optional: true
# Fallback: tap the avatar or settings icon if no id
- tapOn:
    text: "Settings"
    optional: true
# Tap the logout / sign out button
- tapOn:
    text: "Log out"
# Confirm logout if a confirmation dialog appears
- tapOn:
    text: "Yes"
    optional: true
# Assert the app returns to the welcome / login screen
- assertTrue:
    visible:
      anyOf:
        - text: "I already have an account"
        - text: "Create account"
        - text: "Log in"
