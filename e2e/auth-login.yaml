appId: com.thenm334.carebridgemobile
env:
  E2E_PARENT_EMAIL: ${E2E_PARENT_EMAIL}
  E2E_PARENT_PASSWORD: ${E2E_PARENT_PASSWORD}
---
- launchApp
# Welcome screen — tap "Log in" (ghost button)
- tapOn:
    text: "Log in"
# Fill email field
- tapOn:
    text: "Email"
- inputText: ${E2E_PARENT_EMAIL}
# Fill password field
- tapOn:
    text: "Password"
- inputText: ${E2E_PARENT_PASSWORD}
# Tap the "Log in" submit button inside the login form
- tapOn:
    text: "Log in"
    index: 1
# Assert home screen greeting is visible (time-of-day variants)
- assertTrue:
    visible:
      anyOf:
        - text: "Good morning"
        - text: "Good afternoon"
        - text: "Good evening"
